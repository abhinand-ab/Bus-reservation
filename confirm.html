<!DOCTYPE html>
<html>
<head>
    <title>Booking Confirmation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h2>Booking Confirmed ✅</h2>

    <p><strong>Name:</strong> <span id="cname"></span></p>
    <p><strong>From:</strong> <span id="cfrom"></span></p>
    <p><strong>To:</strong> <span id="cto"></span></p>
    <p><strong>Date:</strong> <span id="cdate"></span></p>
    <p><strong>Seats:</strong> <span id="cseats"></span></p>

    <button onclick="goHome()">Book Another Ticket</button>
</div>

<script>
document.getElementById("cname").textContent = localStorage.getItem("name");
document.getElementById("cfrom").textContent = localStorage.getItem("from");
document.getElementById("cto").textContent = localStorage.getItem("to");
document.getElementById("cdate").textContent = localStorage.getItem("date");
document.getElementById("cseats").textContent = localStorage.getItem("seats");

function goHome() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
