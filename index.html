<!DOCTYPE html>
<html>
<head>
    <title>Bus Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <h1>🚌 SmartBus</h1>
</nav>

<div class="container">
    <h2>Book Your Bus Ticket</h2>

    <form id="bookingForm">

        <input type="text" id="name" placeholder="Passenger Name" required>

        <input type="text" id="from" placeholder="From City" required>

        <input type="text" id="to" placeholder="To City" required>

        <input type="date" id="date" required>

        <input type="number" id="seats" placeholder="Number of Seats" min="1" required>

        <button type="submit">Reserve Seat</button>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
